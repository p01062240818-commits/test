function scr(l){const w=l.pos.clone().applyMatrix4(gl.grp.matrixWorld);if(w.z<RAD*RAD/gl.cam.position.z+.06)return null;w.project(gl.cam);const r=gl.cvs.getBoundingClientRect();return{x:(w.x+1)/2*r.width,y:(1-w.y)/2*r.height}}
function selc(i){if(!G||G.over)return;G.sel=i;const p=L3[i].pos.clone().normalize(),h=Math.hypot(p.x,p.z);rotT={y:Math.atan2(-p.x,p.z),x:Math.atan2(p.y,h)};ui()}
function init3d(){const el=$('g3');if(!window.THREE){el.textContent='3D 지구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';return}
let rd;try{rd=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){el.textContent='이 기기에서는 3D를 쓸 수 없어요.';return}
rd.setPixelRatio(Math.min(devicePixelRatio||1,2));el.appendChild(rd.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(36,1,.1,50),grp=new THREE.Group();cam.position.z=5;sc.add(grp);
sc.add(new THREE.AmbientLight(0xffffff,1.35));const sn=new THREE.DirectionalLight(0xffffff,1.4);sn.position.set(-3,3,5);sc.add(sn);
const tex=new THREE.CanvasTexture(base);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
grp.add(new THREE.Mesh(new THREE.SphereGeometry(RAD,72,48),new THREE.MeshPhongMaterial({map:tex,shininess:18,specular:0x335577})));
sc.add(new THREE.Mesh(new THREE.SphereGeometry(RAD*1.04,48,32),new THREE.MeshBasicMaterial({color:0x6fc3ff,transparent:true,opacity:.12,side:THREE.BackSide})));
const up=new THREE.Vector3(0,0,1),ring=(a,b,col)=>new THREE.Mesh(new THREE.RingGeometry(a,b,40),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,side:THREE.DoubleSide}));
CT.forEach((c,i)=>{const pos=p3(c.x*.36-180,90-c.y*.36,RAD+.012),q=new THREE.Quaternion().setFromUnitVectors(up,pos.clone().normalize());
const m=new THREE.Mesh(new THREE.SphereGeometry(.03+c.p*.0018,16,12),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.copy(pos);grp.add(m);
const hl=ring(.065,.08,0x2ee56b),fxr=ring(.06,.075,0x9dffbd);[hl,fxr].forEach(o=>{o.position.copy(pos);o.quaternion.copy(q);grp.add(o)});
const lb=document.createElement('div');lb.className='lab';el.appendChild(lb);L3.push({m,hl,fxr,lb,pos,q,c})});
const sel=ring(.095,.115,0xffd23f);grp.add(sel);
const LD=base.getContext('2d').getImageData(0,0,2000,1000).data;
const dc=document.createElement('canvas');dc.width=dc.height=32;const dx=dc.getContext('2d');dx.beginPath();dx.arc(16,16,14,0,7);dx.fillStyle='#fff';dx.fill();
const PA=new Float32Array(CT.length*60*3),pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(PA,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.034,map:new THREE.CanvasTexture(dc),color:0xe8232a,transparent:true,alphaTest:.4,depthWrite:false}));pts.frustumCulled=false;grp.add(pts);
L3.forEach(l=>{l.n=l.pos.clone().normalize();l.t1=new THREE.Vector3().crossVectors(l.n,new THREE.Vector3(0,1,0)).normalize();l.t2=new THREE.Vector3().crossVectors(l.n,l.t1);l.d=Array.from({length:60},()=>({a:Math.random()*6.283,r:Math.pow(Math.random(),.8)})).sort((a,b)=>a.r-b.r)});
E.forEach(([a,b])=>{const A=L3[a].pos.clone().normalize(),B=L3[b].pos.clone().normalize(),n=Math.max(.2,A.angleTo(B)),pts=[];for(let k=0;k<=24;k++){const t=k/24;pts.push(A.clone().lerp(B,t).normalize().multiplyScalar(RAD+.01+.09*n*Math.sin(Math.PI*t)))}
grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.4})))});
veh.forEach(v=>{v.A=L3[v.a].pos.clone().normalize();v.B=L3[v.b].pos.clone().normalize();v.n=Math.max(.2,v.A.angleTo(v.B));v.mesh=new THREE.Mesh(new THREE.BoxGeometry(.04,.04,.04),new THREE.MeshBasicMaterial({color:v.e==='✈️'?0xffffff:v.e==='🚢'?0xffa726:0x42a5f5}));grp.add(v.mesh)});
const cvs=rd.domElement;let dr=false,mv=0,lx=0,ly=0;
cvs.addEventListener('pointerdown',e=>{dr=gl.dr=true;mv=0;lx=e.clientX;ly=e.clientY;rotT=null;cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',e=>{if(!dr)return;mv+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);grp.rotation.y+=(e.clientX-lx)*.008;grp.rotation.x=Math.max(-1.2,Math.min(1.2,grp.rotation.x+(e.clientY-ly)*.008));lx=e.clientX;ly=e.clientY});
cvs.addEventListener('pointerup',e=>{dr=gl.dr=false;if(mv<14&&G&&!G.over){const r=cvs.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let b=-1,d=12000;L3.forEach((l,i)=>{const s=scr(l);if(s){const q=(s.x-px)**2+(s.y-py)**2;if(q<d){d=q;b=i}}});if(b>=0)selc(b)}});
cvs.addEventListener('pointercancel',()=>dr=gl.dr=false);
el.addEventListener('keydown',e=>{if(!G||G.over)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();selc(((G.sel==null?-1:G.sel)+(e.key==='ArrowRight'?1:-1)+CT.length)%CT.length)}else if(e.key==='Enter')vac()});
const rs=()=>{const w=Math.max(200,el.clientWidth);rd.setSize(w,w,false)};rs();if(window.ResizeObserver)new ResizeObserver(rs).observe(el);else addEventListener('resize',rs);
grp.rotation.y=-.9;grp.rotation.x=.3;Object.assign(gl,{rd,sc,cam,grp,sel,cvs,pts,PA,LD,zt:5})}
function draw(){const g=gl;if(!g.rd)return;const grp=g.grp;
if(rotT){const d=((rotT.y-grp.rotation.y)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;grp.rotation.y+=d*.12;grp.rotation.x+=(rotT.x-grp.rotation.x)*.12;if(Math.abs(d)<.003)rotT=null}
else if(!G&&!g.dr)grp.rotation.y+=.002;
L3.forEach((l,i)=>{const s=G?G.c[i]:{inf:0,imm:0},k=Math.min(1,s.inf*3.5);l.m.material.color.setRGB(1-.12*k,1-.85*k,1-.85*k);l.m.scale.setScalar(1+s.inf*7+(s.inf>.01?Math.sin(Date.now()/250+i)*.12:0));l.hl.material.opacity=Math.min(.95,s.imm*1.4);
const f=fx.find(f=>f.i===i);l.fxr.material.opacity=f?f.a:0;if(f)l.fxr.scale.setScalar(.6+f.r/5)});
grp.updateMatrixWorld();
if(G&&G.sel!=null){g.sel.material.opacity=1;g.sel.position.copy(L3[G.sel].pos);g.sel.quaternion.copy(L3[G.sel].q)}else g.sel.material.opacity=0;
veh.forEach(v=>{if(v.mesh)v.mesh.position.copy(v.A.clone().lerp(v.B,v.t).normalize().multiplyScalar(RAD+.01+.09*v.n*Math.sin(Math.PI*v.t)))});
L3.forEach((l,i)=>{const s=scr(l);if(s){l.lb.style.display='block';l.lb.style.left=s.x+'px';l.lb.style.top=s.y+'px';l.lb.textContent=l.c.n+(G?' '+Math.round(G.c[i].inf*100)+'%':'')}else l.lb.style.display='none'});
g.cam.position.z+=(g.zt-g.cam.position.z)*.15;
let q=0;L3.forEach((l,i)=>{const t=G?G.c[i].inf:0;l.vi=(l.vi||0)+(t-(l.vi||0))*.06;const vi=l.vi,cnt=vi<.0005?0:Math.min(60,Math.ceil(vi*220)),mt=Math.min(.65,.05+vi*1.3);
for(let k=0;k<60;k++){let x=0,y=0,z=0;if(k<cnt){const dd=l.d[k],th=mt*dd.r,s=Math.sin(th),c=Math.cos(th);tv.copy(l.n).multiplyScalar(c).addScaledVector(l.t1,s*Math.cos(dd.a)).addScaledVector(l.t2,s*Math.sin(dd.a));if(th<.05||isLand(tv)){tv.multiplyScalar(RAD+.008);x=tv.x;y=tv.y;z=tv.z}}g.PA[q++]=x;g.PA[q++]=y;g.PA[q++]=z}});
g.pts.geometry.attributes.position.needsUpdate=true;
if(g.chips)g.chips.forEach((b,i)=>{const t=CT[i].n+(G?' '+Math.round(G.c[i].inf*100)+'%':'');if(b.textContent!==t)b.textContent=t;b.style.borderColor=G&&G.sel===i?'#ffd23f':'';b.style.background=G?'rgba(217,69,58,'+Math.min(.75,G.c[i].inf*2.5)+')':''});
g.rd.render(g.sc,g.cam)}
const tv=window.THREE?new THREE.Vector3():null;
function isLand(v){const lat=Math.asin(Math.max(-1,Math.min(1,v.y)))*57.2958;let t=Math.atan2(v.z,-v.x);if(t<0)t+=6.2832;const px=Math.min(1999,t*57.2958/360*2000|0),py=Math.max(0,Math.min(999,(90-lat)/180*1000|0)),k=(py*2000+px)*4,D=gl.LD;return D[k+1]>D[k+2]+15&&D[k+1]>D[k]}
function face(i){const p=L3[i].pos.clone().normalize(),h=Math.hypot(p.x,p.z);rotT={y:Math.atan2(-p.x,p.z),x:Math.atan2(p.y,h)}}
function zoom(d){const g=gl;if(!g.rd)return;g.zt=Math.max(2.7,Math.min(5.4,g.zt+d));if(d<0&&G&&!G.over){let i=G.sel;if(i==null){i=0;G.c.forEach((c,k)=>{if(c.inf>G.c[i].inf)i=k})}face(i)}}
function setupUI(){if(!gl.rd)return;const st=document.createElement('style');st.textContent='.zb{position:absolute;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid #fff8;background:#000a;color:#fff;font-size:20px;font-weight:800;z-index:3}.chip{border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:5px 9px;font-size:12px;font-weight:700;margin:2px}';document.head.appendChild(st);const el=$('g3');
[['\uff0b',-.8,'\ud655\ub300',8],['\uff0d',.8,'\ucd95\uc18c',54],['\ud83c\udf0d',9,'\uc804\uccb4 \ubcf4\uae30',100]].forEach(([t,d,a,top])=>{const b=document.createElement('button');b.className='zb';b.style.top=top+'px';b.textContent=t;b.setAttribute('aria-label','\uc9c0\uad6c '+a);b.onclick=()=>zoom(d);el.appendChild(b)});
const cl=document.createElement('div');cl.style.marginTop='8px';cl.setAttribute('role','group');cl.setAttribute('aria-label','\ub3c4\uc2dc \uc120\ud0dd');CT.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.onclick=()=>{if(G&&!G.over)selc(i);else face(i)};cl.appendChild(b)});el.insertAdjacentElement('afterend',cl);gl.chips=[...cl.children];
el.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY*.004)},{passive:false})}
menu();init3d();setupUI();requestAnimationFrame(t=>{last=t;loop(t)});
</script></body></html>
